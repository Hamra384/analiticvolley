name: Spike
description: Investigación técnica con time-box
labels: ["type:spike"]
body:
  - type: textarea
    id: pregunta
    attributes: {label: Pregunta a responder}
    validations: {required: true}
  - type: input
    id: timebox
    attributes: {label: Time-box}
    validations: {required: true}
  - type: textarea
    id: criterios
    attributes: {label: Criterios de decisión (definidos antes de medir)}
    validations: {required: true}
  - type: textarea
    id: fin
    attributes: {label: Criterio de finalización}
    validations: {required: true}
