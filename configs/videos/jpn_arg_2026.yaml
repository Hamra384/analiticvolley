# Configuración visual del video jpn_arg_2026 (SPEC-002 RF-2, RF-3).
# Calibrado 2026-10-02 sobre muestras de los clips A1–A5 (k-means de color de torso + verificación visual).
# Colores en Lab de OpenCV (8 bits: L, a, b en 0..255). TEAM_A = Japón en ambos videos.

court:
  # piso naranja de la cancha (pico de tono 10); la zona libre es verde/turquesa
  hsv_ranges:
    # revisión S4: el rango anterior [3,25,80]-[18,255,255] dejaba afuera la esquina cercana derecha (reflejo,
    # menor saturación); verificado visualmente en A2 frame 9:15 que este rango cubre la cancha completa
    - lower: [2, 10, 60]
      upper: [20, 255, 255]
  margin_px: 25
exclude_regions:
  # marcador sobreimpreso (fracciones del frame: x1, y1, x2, y2)
  - [0.0, 0.0, 1.0, 0.07]

# S4.1: oficiales (se descartan antes del tracker). Medido en A2 sobre 290 recortes de jueces de línea:
# chaleco gris, Lab mediana [122,126,126] (p10 [104,123,124], p90 [134,127,128]).
officials:
  - [122, 126, 126]
  - [105, 124, 125]   # sombra / tono más oscuro del mismo chaleco (p10)
  # staff con remera naranja junto a la cancha (cluster de la calibración S4, Lab ~[126,150,153]); en la revisión
  # visual de S4.1 heredó la identidad de un jugador. El líbero rojo #37 queda más cerca de su propio prototipo.
  - [126, 150, 153]

teams:
  A:
    name: Japón
    main: [190, 130, 128]     # camiseta blanca
    libero: [126, 162, 150]   # líbero rojo #37
    libero_numbers: [37]   # SPEC-003 RF-6: el número decide líbero aunque el color sea ambiguo
  B:
    name: Argentina
    main: [60, 130, 124]      # camiseta azul marino / negra
    libero: [190, 130, 128]   # líbero blanco #19: ambiguo con el principal de A -> se resuelve por lado
    libero_numbers: [19]   # SPEC-003 RF-6: el número decide líbero aunque el color sea ambiguo
