# Configuración visual del video jpn_arg_2026 (SPEC-002 RF-2, RF-3).
# Calibrado 2026-10-02 sobre muestras de los clips A1–A5 (k-means de color de torso + verificación visual).
# Colores en Lab de OpenCV (8 bits: L, a, b en 0..255). TEAM_A = Japón en ambos videos.

court:
  # piso naranja de la cancha (pico de tono 10); la zona libre es verde/turquesa
  hsv_ranges:
    - lower: [3, 25, 80]
      upper: [18, 255, 255]
  margin_px: 25
exclude_regions:
  # marcador sobreimpreso (fracciones del frame: x1, y1, x2, y2)
  - [0.0, 0.0, 1.0, 0.07]

teams:
  A:
    name: Japón
    main: [190, 130, 128]     # camiseta blanca
    libero: [126, 162, 150]   # líbero rojo #37
  B:
    name: Argentina
    main: [60, 130, 124]      # camiseta azul marino / negra
    libero: [190, 130, 128]   # líbero blanco #19: ambiguo con el principal de A -> se resuelve por lado
