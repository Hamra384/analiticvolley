# Catálogo de clips de evaluación del MVP 1.
# Rutas relativas al directorio de datos (VOLLEY_DATA_DIR / configs/local.yaml).
# Los videos NO se versionan (repo público). Fuente y licencia: docs/data/DATASETS.md
# Selección: auditoría S2-pre (2026-10-01): escaneo automático + verificación visual con tiras de 8 frames.
# Todos los clips caen dentro de un único tramo sin cortes de edición (detector calibrado).

videos:
  jpn_arg_2026:
    file: videos/external/jpn_arg_2026.mp4
    source: https://www.youtube.com/watch?v=oFMjaZ_z3X8
    resolution: 1920x1080@30
    notes: Edición solo-rallies (198 cortes). Cámara de cabecera con paneo. Líbero rojo (equipo blanco) y blanco #19 (equipo oscuro).
  jpn_kor_2026:
    file: videos/external/jpn_kor_2026.mp4
    source: https://www.youtube.com/watch?v=dgU-3rkwf4Q
    resolution: 1280x720@30
    notes: Edición solo-rallies (185 cortes). Líbero oscuro en equipo blanco.

clips:
  - id: A1
    video: jpn_arg_2026
    start: "15:21"
    duration_s: 20
    scenarios: [tracking_normal, camera_pan, numbers_visible, numbers_invisible]
    verified: true
    notes: Jugador #33 fuera de cancha abajo a la derecha; posible sustitución, sin confirmar.
  - id: A2
