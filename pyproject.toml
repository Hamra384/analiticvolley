[project]
name = "volley-cv"
version = "0.1.0"
description = "Detección, tracking y re-identificación de jugadores y pelota en video de vóley"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1,<2.3",
    "scipy>=1.14",
    "opencv-python>=4.10,<5",
    "pyyaml>=6.0",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
# Modelos de detección / Re-ID. Pesado (GPU); no se instala en CI.
ml = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "ultralytics==8.4.53",
    "onnxruntime>=1.19",
    "boxmot>=25.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volley_cv"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu121", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: requiere GPU y extra ml (no corre en CI)",
]

[tool.coverage.run]
source = ["volley_cv"]
branch = true

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", ".claude/hooks"]
explicit_package_bases = true
exclude = ["legacy/"]

[[tool.mypy.overrides]]
module = ["cv2", "scipy.*", "ultralytics.*"]
ignore_missing_imports = true
